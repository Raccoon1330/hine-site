<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>·低度戀愛酒‧ HINE — 连接中</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:rgba(255,255,255,.85);letter-spacing:1px}

.stage{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:#000;
}

.stars{position:absolute;inset:0;overflow:hidden;will-change:transform}
.star{
  position:absolute;border-radius:50%;background:#fff;
  will-change:opacity,transform;
  animation:twinkle var(--dur,3s) ease-in-out infinite var(--delay,0s),
             drift 18s linear infinite;
  animation-composition:add;
}
.star.gold{background:#e8d8a0}
@keyframes twinkle{
  0%,100%{opacity:var(--min,.3)}
  50%{opacity:1}
}
@keyframes drift{
  0%{transform:translate(0,0)}
  100%{transform:translate(-60px,-40px)}
}

.center{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:36px;
  transform:translateY(0);
}

.avatars{
  display:flex;align-items:center;gap:12px;
}
.avatar{
  width:128px;height:128px;border-radius:50%;
  background:rgba(255,255,255,.06);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  box-shadow:0 0 30px rgba(255,255,255,.35),0 0 60px rgba(255,255,255,.15);
  animation:avatarBreathe 2s ease-in-out infinite, avatarFade 1.2s ease forwards;
  opacity:0;transform:scale(.8);
  will-change:transform,opacity;
}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.avatar .placeholder{
  width:60%;height:60%;border-radius:50%;
  background:linear-gradient(135deg,rgba(255,255,255,.15),rgba(255,255,255,.03));
  border:1px solid rgba(255,255,255,.15);
}
.avatar.a-left{animation-delay:0s,.2s}
.avatar.a-right{animation-delay:0s,.4s}
.avatar.flash{animation:avatarFlash .5s ease-out}

@keyframes avatarFade{
  to{opacity:1;transform:scale(1)}
}
@keyframes avatarBreathe{
  0%,100%{box-shadow:0 0 30px rgba(255,255,255,.35),0 0 60px rgba(255,255,255,.15)}
  50%{box-shadow:0 0 45px rgba(255,255,255,.55),0 0 90px rgba(255,255,255,.25)}
}
@keyframes avatarFlash{
  0%{box-shadow:0 0 30px rgba(255,255,255,.35),0 0 60px rgba(255,255,255,.15);transform:scale(1)}
  30%{box-shadow:0 0 60px #fff,0 0 120px rgba(255,255,255,.5);transform:scale(1.08)}
  100%{box-shadow:0 0 30px rgba(255,255,255,.35),0 0 60px rgba(255,255,255,.15);transform:scale(1)}
}

.gap-dot{
  width:10px;height:10px;border-radius:50%;
  background:rgba(255,255,255,.25);
  animation:dotPulse 2s ease-in-out infinite .6s;
}
@keyframes dotPulse{
  0%,100%{opacity:.25;transform:scale(.9)}
  50%{opacity:.7;transform:scale(1.1)}
}

.text-wrap{
  min-height:28px;display:flex;align-items:center;justify-content:center;
  font-size:18px;color:rgba(255,255,255,.85);letter-spacing:1px;
}
.text{opacity:0;animation:textFade .5s ease forwards}
@keyframes textFade{to{opacity:1}}

.cursor{
  display:inline-block;width:2px;height:18px;background:rgba(255,255,255,.85);
  margin-left:2px;vertical-align:-2px;
  animation:cursorBlink .8s step-end infinite;
}
@keyframes cursorBlink{
  0%,50%{opacity:1}
  51%,100%{opacity:0}
}

.dots{display:inline-flex;gap:2px;margin-left:2px}
.dots span{
  display:inline-block;width:4px;height:4px;border-radius:50%;
  background:rgba(255,255,255,.7);
  animation:dotBounce 1.4s ease-in-out infinite;
}
.dots span:nth-child(2){animation-delay:.15s}
.dots span:nth-child(3){animation-delay:.3s}
@keyframes dotBounce{
  0%,80%,100%{transform:translateY(0);opacity:.5}
  40%{transform:translateY(-5px);opacity:1}
}

.footer{
  position:absolute;bottom:40px;left:50%;transform:translateX(-50%);
  font-size:12px;color:rgba(255,255,255,.25);letter-spacing:2px;
  text-transform:uppercase;
}
.progress-bar{
  position:absolute;bottom:70px;left:50%;transform:translateX(-50%);
  width:200px;height:2px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;
}
.progress-fill{
  height:100%;background:linear-gradient(90deg,rgba(255,255,255,.6),rgba(255,255,255,.2));
  border-radius:2px;width:0%;
  animation:progressFill 5.2s linear forwards;
}
@keyframes progressFill{
  0%{width:0%}
  100%{width:100%}
}

@media (prefers-reduced-motion:reduce){
  .star,.avatar,.gap-dot,.cursor,.dots span,.progress-fill{animation:none !important}
  .avatar{opacity:1;transform:none}
  .text{opacity:1}
}

@media(max-width:480px){
  .avatar{width:96px;height:96px}
  .avatars{gap:8px}
  .text-wrap{font-size:15px}
}
</style>
</head>
<body>
<div class="stage">
  <div class="stars" id="stars"></div>

  <div class="center">
    <div class="avatars">
      <div class="avatar a-left" id="avatarLeft">
        <div class="placeholder"></div>
      </div>
      <div class="gap-dot"></div>
      <div class="avatar a-right" id="avatarRight">
        <div class="placeholder"></div>
      </div>
    </div>
    <div class="text-wrap" id="textWrap">
      <span class="text" id="text"></span><span class="cursor" id="cursor"></span>
    </div>
  </div>

  <div class="progress-bar"><div class="progress-fill"></div></div>
  <div class="footer">· 低度戀愛酒 · HINE</div>
</div>

<script>
(function(){
  var avatarLeft = document.getElementById('avatarLeft');
  var avatarRight = document.getElementById('avatarRight');

  avatarLeft.innerHTML = '<img src="./images/partner.png" onerror="this.style.display=\'none\'" alt="">';
  avatarRight.innerHTML = '<img src="./images/self.png" onerror="this.style.display=\'none\'" alt="">';

  var starsLayer = document.getElementById('stars');
  for(var i=0;i<60;i++){
    var s = document.createElement('div');
    s.className = 'star' + (Math.random()<.25?' gold':'');
    var size = 1 + Math.random()*2;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.left = Math.random()*100 + '%';
    s.style.top = Math.random()*100 + '%';
    s.style.setProperty('--dur', (2+Math.random()*4) + 's');
    s.style.setProperty('--delay', (Math.random()*5) + 's');
    s.style.setProperty('--min', (.15 + Math.random()*.35).toFixed(2));
    starsLayer.appendChild(s);
  }

  var textEl = document.getElementById('text');
  var cursorEl = document.getElementById('cursor');
  var avatarR = document.getElementById('avatarRight');

  var phase1 = '等待 黑泽阵 进入中';
  var phase2 = '连接成功，欢迎来到 HINE';

  var stage = document.querySelector('.stage');
  var flashEl = avatarLeft;

  function typeText(str, done){
    textEl.textContent = '';
    textEl.classList.remove('textFade');
    void textEl.offsetWidth;
    textEl.style.animation = 'none';
    textEl.offsetHeight;
    textEl.style.animation = '';
    textEl.style.opacity = '1';
    textEl.classList.add('text');
    var i = 0;
    var iv = setInterval(function(){
      if(i>=str.length){ clearInterval(iv); done && done(); return; }
      textEl.textContent += str.charAt(i);
      i++;
    }, 55);
  }

  function flashPartner(){
    flashEl.classList.remove('flash');
    void flashEl.offsetWidth;
    flashEl.classList.add('flash');
    setTimeout(function(){ flashEl.classList.remove('flash'); }, 500);
  }

  function fadeOutAndGo(){
    stage.style.transition = 'opacity .8s ease';
    stage.style.opacity = '0';
    setTimeout(function(){
      window.location.href = './index.html';
    }, 900);
  }

  var stage1Done = false;

  typeText(phase1, function(){ stage1Done = true; });

  setTimeout(function(){ if(stage1Done) flashPartner(); }, 1200);

  setTimeout(function(){
    if(stage1Done){
      textEl.innerHTML = phase1 + '<span class="dots"><span></span><span></span><span></span></span>';
    }
  }, 1500);

  setTimeout(function(){
    textEl.style.animation = 'textFade .5s ease reverse forwards';
  }, 2300);

  setTimeout(function(){
    typeText(phase2);
  }, 2900);

  setTimeout(fadeOutAndGo, 5200);
})();
</script>
</body>
</html>
